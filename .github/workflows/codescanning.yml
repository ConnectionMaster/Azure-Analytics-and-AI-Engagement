name: Secret Scan
on:
  push:
  pull_request:
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Run TruffleHog Secret Scanner
        uses: "trufflesecurity/trufflehog@main"
        with:
          path: "."
          fail: true
